<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sail Trainer · phone preview</title>
  <style>
    body { margin: 0; padding: 24px; background: #e8eef3; color: #103660; font: 15px system-ui, sans-serif; }
    header { max-width: 780px; margin: 0 auto 18px; display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
    h1 { margin: 0; font-size: 20px; }
    a { color: #145d8a; }
    iframe { display: block; width: 390px; height: 760px; max-width: 100%; margin: auto; border: 10px solid #17344f; border-radius: 24px; background: #fff; box-shadow: 0 14px 42px #183b5b33; }
    #fileNotice { max-width: 780px; margin: 20px auto; padding: 18px; background: #fff; border-radius: 10px; }
    code { user-select: all; }
    @media (max-width: 460px) { body { padding: 12px; } iframe { box-sizing: border-box; } }
  </style>
</head>
<body>
  <header><h1>Phone preview · 390 × 760</h1><a href="../index.html">Open full-size simulator</a></header>
  <div id="fileNotice" hidden>
    This app needs a local web server to load its modules. From the project folder, run
    <code>python3 -m http.server 8000</code>, then open
    <a href="http://localhost:8000/tests/phone-preview.html">the phone preview</a>.
  </div>
  <iframe title="Sail Trainer phone viewport" src="../index.html"></iframe>
  <script>
    if (location.protocol === 'file:') {
      document.getElementById('fileNotice').hidden = false;
      document.querySelector('iframe').hidden = true;
    }
  </script>
</body>
</html>
